name: protoboard-editor

# Self-hosting: see "Self-hosting" in README.md.
# Settings: a .env file next to this file (PUBLIC_URL, EDITOR_PORT) and
# /etc/protoboard-editor/.env for Django.

services:
  django:
    build:
      context: ./src/backend
    env_file: /etc/protoboard-editor/.env
    volumes:
      - /etc/protoboard-editor/data:/etc/protoboard-editor/data
    expose:
      - "8000"
    restart: unless-stopped

  nextjs:
    build:
      context: ./src/frontend
      args:
        # The address people open in the browser, e.g. http://192.168.1.50:8080.
        # Built into the frontend, so rebuild after a change.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}/api
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${EDITOR_BIND:-0.0.0.0}:${EDITOR_PORT:-8080}:80"
    volumes:
      - ./src/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - ADMIN_ALLOWED_IP=${ADMIN_ALLOWED_IP:-127.0.0.1}
      - BACKUP_ALLOWED_IP=${BACKUP_ALLOWED_IP:-127.0.0.1}
    depends_on:
      - django
      - nextjs
    restart: unless-stopped
